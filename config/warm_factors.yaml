# EPA Waste Reduction Model (WARM) emission factors.
# Units: metric tons of CO2 equivalent (MTCO2e) per SHORT ton (2,000 lbs) of material.
# Negative = emissions avoided/stored; positive = emissions released.
#
# Do NOT edit individual numbers unless you are replacing the whole table with a
# newer official WARM release. When EPA publishes a new version, update
# warm_version, source, and every factor below together.

warm_version: 16
release_date: "December 2023"
units: "MTCO2e per short ton"
source: >-
  EPA WARM Version 16, Management Practices Chapters, Exhibit 1-1
url: "https://www.epa.gov/system/files/documents/2024-01/warm_management_practices_v16_dec.pdf"

# Management practice keys used by the code / settings.yaml.
practices:
  source_reduction: "Source reduction"
  recycling: "Recycling"
  combustion: "Combustion"
  landfilling: "Landfilling"

# null = not applicable in WARM (NA).
factors:
  Corrugated Containers:  {source_reduction: -5.58, recycling: -3.14, combustion: -0.49, landfilling: 0.18}
  Mixed Paper (general):  {source_reduction: -6.07, recycling: -3.55, combustion: -0.49, landfilling: 0.07}
  Office Paper:           {source_reduction: -7.95, recycling: -2.86, combustion: -0.47, landfilling: 1.13}
  HDPE:                   {source_reduction: -1.42, recycling: -0.76, combustion: 1.29,  landfilling: 0.02}
  LDPE:                   {source_reduction: -1.80, recycling: null,  combustion: 1.29,  landfilling: 0.02}
  PET:                    {source_reduction: -2.17, recycling: -1.04, combustion: 1.24,  landfilling: 0.02}
  LLDPE:                  {source_reduction: -1.58, recycling: null,  combustion: 1.29,  landfilling: 0.02}
  PP:                     {source_reduction: -1.52, recycling: -0.79, combustion: 1.29,  landfilling: 0.02}
  PS:                     {source_reduction: -2.50, recycling: null,  combustion: 1.65,  landfilling: 0.02}
  PVC:                    {source_reduction: -1.93, recycling: null,  combustion: 0.66,  landfilling: 0.02}
  Mixed Plastics:         {source_reduction: -1.87, recycling: -0.93, combustion: 1.26,  landfilling: 0.02}
  Steel Cans:             {source_reduction: -3.03, recycling: -1.83, combustion: -1.59, landfilling: 0.02}
